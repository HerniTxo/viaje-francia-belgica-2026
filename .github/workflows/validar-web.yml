name: Verificar web del viaje
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/**', '.github/workflows/validar-web.yml']
  pull_request:
    branches: [main]
jobs:
  validar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar JavaScript
        run: |
          node --check docs/app.js
          node --check docs/maps-config.js
      - name: Comprobar datos, enlaces internos, mapas y privacidad
        run: node scripts/validate.mjs
